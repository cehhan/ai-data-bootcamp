    o.push(el("rect",{x:(X0+k*bp+0.7).toFixed(1),y:(bot-h).toFixed(1),
      width:Math.max(bp-1.4,1).toFixed(1),height:h.toFixed(1),fill:BLUE,opacity:0.75,rx:2}));}
  if(means.length>4){var p="";
    for(k=0;k<cu.length;k++)p+=(k?" L":"M")+sx(cu[k][0]).toFixed(1)+" "+(bot-cu[k][1]/t2*H).toFixed(1);
    o.push(el("path",{d:p,fill:"none",stroke:ORANGE,"stroke-width":2}));}
  o.push(el("line",{x1:X0,y1:bot,x2:X1,y2:bot,stroke:"#888780","stroke-width":1}));
  for(k=0;k<=6;k++){var tv=lo+(hi-lo)*k/6;
    o.push(el("text",{x:sx(tv).toFixed(1),y:308,fill:"#888780","font-size":11,"text-anchor":"middle"},
      tv.toFixed(zoomed?1:0)));}
  svg.innerHTML=o.join("");
  var e=expSE(),t=theoSE(),err=e?((e-t)/t*100):0;
  var cards=[["표본 크기 n",String(n)],["시행 횟수",String(means.length)],
    ["평균들의 평균",means.length?meanOf(means).toFixed(3):"—"],
    ["실험적 표준오차",e?e.toFixed(3):"—"],["이론적 σ/√n",t.toFixed(3)],
    ["오차율",e?(err>0?"+":"")+err.toFixed(1)+"%":"—"]];
  statsEl.innerHTML=cards.map(function(c,i){
    var col=i===3?BLUE:(i===4?ORANGE:"#2c2c2a");
    return '<div style="background:#f7f7f5; border-radius:8px; padding:9px 11px;">'
      +'<div style="font-size:12px; color:#5f5e5a;">'+c[0]+'</div>'
      +'<div style="font-size:19px; font-weight:500; color:'+col+';">'+c[1]+'</div></div>';}).join("");
  root.querySelectorAll(".nbtn").forEach(function(b){
    var on=+b.dataset.n===n;
    b.style.background=on?"#e6f1fb":"#fff";
    b.style.borderColor=on?BLUE:"#c3c2b7";});
}
root.querySelector("#one").onclick=function(){draw1();render();};
root.querySelector("#hundred").onclick=function(){for(var i=0;i<100;i++)draw1();render();};
root.querySelector("#reset").onclick=function(){means=[];last=[];render();};
root.querySelector("#zoom").onclick=function(){zoomed=!zoomed;
  this.textContent=zoomed?"x축 고정":"x축 확대";render();};
root.querySelectorAll(".nbtn").forEach(function(b){
  b.onclick=function(){n=+b.dataset.n;means=[];last=[];render();};});
render();
})();
</script>
